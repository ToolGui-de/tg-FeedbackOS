# tg-FeedbackOS in Coolify (service "tg-feedbackos" on NAFDO), modelled on PayGlue's
# quackback service. Coolify fills the SERVICE_* variables; nothing secret lives here.
# Domain on "app": https://hub.toolgui.de:3000 (DNS A record, no Cloudflare proxy).
# Fill in Coolify before the first deploy: EMAIL_RESEND_API_KEY, IMAP_USER, IMAP_PASSWORD,
# IMAP_MAILBOX. Everything else is fixed here or generated by Coolify (SERVICE_*).
services:
  app:
    image: ghcr.io/toolgui-de/tg-feedbackos:0.16.1-tg3
    restart: unless-stopped
    init: true
    environment:
      - SERVICE_URL_APP_3000
      - BASE_URL=https://hub.toolgui.de
      - TRUSTED_PROXY_HOPS=1
      - SECRET_KEY=${SERVICE_BASE64_64_SECRET}
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/tgfeedbackos
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=tgfeedbackos
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - S3_PROXY=true
      - S3_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - S3_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - DISABLE_TELEMETRY=true
      # AI through OpenAI (key and models set in Coolify)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-gpt-4.1-mini}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      - SETUP_OWNER_EMAIL=andre@nafdo.de
      # Sending through Resend (own ToolGui.de account; key set in Coolify)
      - EMAIL_FROM=ToolGui.de - Team <team@toolgui.de>
      - EMAIL_APP_NAME=ToolGui.de
      - EMAIL_LANG=de
      - EMAIL_LOGO_URL=https://toolgui.de/apple-touch-icon.png
      - EMAIL_RESEND_API_KEY=${EMAIL_RESEND_API_KEY}
      # Replies: reply+...@support.toolgui.de via Resend Receiving (MX at Resend)
      - EMAIL_INBOUND_DOMAIN=support.toolgui.de
      - EMAIL_INBOUND_SIGNING_SECRET=${SERVICE_PASSWORD_64_INBOUNDSIGNING}
      # New mail to support@toolgui.de, fetched from Fastmail (user and app password set in Coolify)
      - EMAIL_INBOUND_PROVIDER=imap
      - IMAP_HOST=imap.fastmail.com
      - IMAP_PORT=993
      - IMAP_TLS=true
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - IMAP_MAILBOX=${IMAP_MAILBOX}
      - IMAP_MARK_SEEN_ALSO=${IMAP_MARK_SEEN_ALSO:-[07] ToolGui.de}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      - POSTGRES_DB=tgfeedbackos
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - tg-feedbackos-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    restart: unless-stopped
    command: server /data
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    volumes:
      - tg-feedbackos-files:/data
    healthcheck:
      test: ['CMD', 'silo', 'healthcheck', 'ready']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z@sha256:ce62c9053c69ce12a527a322345b5ad9f44b5f8a7b8189f82e516f2e3f30f1d8
    restart: 'no'
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/tgfeedbackos'

volumes:
  tg-feedbackos-postgres:
  tg-feedbackos-files:
